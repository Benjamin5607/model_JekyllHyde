# MCP Mesh — distributed worker nodes (separate PCs / processes)

mesh:
  enabled: true
  hub_url: http://127.0.0.1:8091
  node_id: local-manager
  heartbeat_seconds: 30
  task_timeout_seconds: 120
  prefer_remote_for:
    - market_scan
    - quant_context
    - verification_scan
    - memory_retrieve

nodes: []
